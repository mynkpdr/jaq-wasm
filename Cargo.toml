[package]
name = "jaq-wasm"
description = "Wasm wrapper for jaq"
version = "0.1.0"
authors = ["Mayank Kumar Poddar"]
categories = ["wasm"]
license = "MIT"
edition = "2021"
repository = "https://github.com/mynkpdr/jaq-wasm"
homepage = "https://github.com/mynkpdr/jaq-wasm#readme"
keywords = ["jaq", "jq", "wasm", "webassembly", "json"]
readme = "README.md"
publish = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jaq-core = { path = "./jaq-core" }
jaq-fmts = { path = "./jaq-fmts" }
jaq-json = { path = "./jaq-json", features = ["serde"] }
jaq-std = { path = "./jaq-std" }
serde_json = { version = "1.0", features = ["preserve_order"] }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"